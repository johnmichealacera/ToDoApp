<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Taskify — a calm, focused task list. Add, complete, edit, and delete tasks with local persistence.">
	<title>Taskify</title>
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="page-gradient" aria-hidden="true"></div>
	<main class="main">
		<header class="app-header">
			<div class="brand">
				<h1 class="app-title">Taskify</h1>
				<p class="app-tagline">Your day, one task at a time.</p>
			</div>
			<div class="header-actions">
				<span class="account-email" id="accountEmail" hidden></span>
				<button type="button" class="btn btn-account" id="authButton" hidden>Sign in</button>
				<button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch color theme" title="Theme">
					<span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">☀</span>
					<span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">☽</span>
				</button>
			</div>
		</header>

		<p class="feedback" id="taskFeedback" role="alert" aria-live="assertive" hidden></p>

		<section class="empty-state signed-out" id="signedOut" hidden>
			<p class="empty-state__title">Your tasks, on every device</p>
			<p class="empty-state__body">Sign in or create a free account to keep your list in the cloud.</p>
			<button type="button" class="btn btn-primary btn-standalone" id="signInCta">Sign in or sign up</button>
		</section>

		<div class="task-area" id="taskArea">
		<section class="stats-panel" id="taskData" role="status" aria-live="polite">
			<span class="stats-panel__text">No tasks yet.</span>
		</section>

		<form class="add-task" id="addTaskForm" novalidate>
			<label class="visually-hidden" for="inpTodo">New task</label>
			<input
				class="form-control form-control--grow"
				type="text"
				name="task"
				id="inpTodo"
				placeholder="What do you plan to do?"
				autocomplete="off"
				maxlength="500"
				aria-describedby="hint-shortcuts"
			>
			<button type="submit" class="btn btn-primary" id="btnTodo">Add task</button>
		</form>
		<p id="hint-shortcuts" class="form-hint">Press <kbd>Enter</kbd> to add. Double-click a task to rename.</p>

		<div class="list-shell">
			<ul class="task-list list-unstyled" id="listTodo"></ul>
			<div class="empty-state" id="emptyState" hidden>
				<p class="empty-state__title">Nothing here yet</p>
				<p class="empty-state__body">Add something small above — momentum builds from the first checkbox.</p>
			</div>
		</div>

		<footer class="app-footer">
			<button type="button" class="btn btn-ghost btn-sm" id="clearCompleted" hidden>Clear completed</button>
		</footer>
		</div>
	</main>
	<script src="config.js"></script>
	<script src="auth.js"></script>
	<script src="store.js"></script>
	<script src="app.js"></script>
</body>
</html>
